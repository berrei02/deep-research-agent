services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: deep_research_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-research}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-research}
      POSTGRES_DB: ${POSTGRES_DB:-deep_research}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-research} -d ${POSTGRES_DB:-deep_research}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
