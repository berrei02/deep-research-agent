[project]
name = "deep-research-agent"
version = "0.1.0"
description = "Deep Research Agent using LangChain Deep Agents with PostgreSQL virtual filesystem backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langchain-deepagent[postgres]>=0.1.0",
    "langchain-openai>=0.3.0",
    "python-dotenv>=1.0.0",
    "psycopg[binary,pool]>=3.2.0",
    "jupyter>=1.1.0",
    "ipykernel>=6.29.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
